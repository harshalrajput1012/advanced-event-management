services:
  mysql:
    image: mysql:8.4
    container_name: eventpro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_management
    ports:
      - "3306:3306"
    volumes:
      - eventpro_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  eventpro_mysql:
